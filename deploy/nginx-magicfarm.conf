# MagicFarm — добавить в инклюд-файл домена belovolovhome.ru.
# FastPanel2: /etc/nginx/fastpanel2-sites/belovolovhom_usr/belovolovhome.ru.includes
# После добавления: nginx -t && systemctl reload nginx

location = /magicfarm {
    return 301 /magicfarm/;
}

# SPA (Vite, base /magicfarm/)
location /magicfarm/ {
    alias /opt/magicfarm/frontend/dist/;
    try_files $uri $uri/ @magicfarm_spa;
}

location @magicfarm_spa {
    rewrite ^ /magicfarm/index.html last;
}

# API + uploads
location /magicfarm/api/ {
    proxy_pass http://127.0.0.1:8003/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
}
