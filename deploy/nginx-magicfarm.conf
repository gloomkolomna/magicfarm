# MagicFarm — добавить в инклюд-файл домена belovolovhome.ru.
# FastPanel2: /etc/nginx/fastpanel2-sites/belovolovhom_usr/belovolovhome.ru.includes
# Паттерн 1:1 как у /crm/ и /dragons/ (^~ + alias + @spa fallback через root).
# После добавления: nginx -t && systemctl reload nginx

location = /magicfarm {
    return 301 /magicfarm/;
}

location = /magicfarm/game {
    return 301 /magicfarm/game/;
}

# Хэшированные ассеты Vite: кэшируем агрессивно.
location ^~ /magicfarm/assets/ {
    alias /opt/magicfarm/frontend/dist/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    gzip_static on;
}

# Лендинг + документы (оферта/правила/политика) — статика из public/game/, без SPA-fallback.
location ^~ /magicfarm/game/ {
    alias /opt/magicfarm/frontend/dist/game/;
    index index.html;
    types { text/markdown md; }
    charset utf-8;
    add_header Cache-Control "no-cache";
    gzip_static on;
}

location ^~ /magicfarm/ {
    alias /opt/magicfarm/frontend/dist/;
    try_files $uri @magicfarm_spa;
    gzip_static on;
}

# index.html без кэша: после деплоя браузер сразу забирает свежие хэши чанков.
# Точный локейшн выше префиксного — иначе /index.html уходил в ^~ /magicfarm/ без Cache-Control.
location = /magicfarm/index.html {
    alias /opt/magicfarm/frontend/dist/index.html;
    add_header Cache-Control "no-cache";
}

location @magicfarm_spa {
    root /opt/magicfarm/frontend/dist;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}

location ^~ /magicfarm/api/ {
    proxy_pass http://127.0.0.1:8003/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 60m;
}
